<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống | EduSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js"></script>
</head>
<body class="min-h-screen flex flex-col text-slate-800" data-page="login">
    <div id="appHeader"></div>
    <div id="appFlash"></div>

    <main class="flex-1">
        <div class="max-w-md mx-auto px-4 py-12">
            <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/50 p-8">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-600 to-blue-600 text-white flex items-center justify-center text-2xl mx-auto shadow-lg shadow-indigo-500/30 mb-3">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-slate-900">Đăng Nhập Hệ Thống</h1>
                    <p class="text-xs text-slate-500 mt-1">Đăng nhập tài khoản Học sinh hoặc Quản trị (Admin)</p>
                </div>

                <div id="loginErrorBox" class="hidden mb-5 p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-sm"></i>
                    <span id="loginErrorText"></span>
                </div>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tên đăng nhập</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" id="loginUsername" required
                                   placeholder="Nhập tên đăng nhập..."
                                   class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 outline-none text-sm font-medium">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Mật khẩu</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="loginPassword" required
                                   placeholder="Nhập mật khẩu..."
                                   class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 outline-none text-sm font-medium">
                        </div>
                    </div>

                    <button type="submit" id="loginSubmitBtn" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-500/25 transition">
                        Đăng nhập ngay
                    </button>
                </form>

                <p class="text-center text-xs text-slate-500 mt-6">
                    Chưa có tài khoản học sinh?
                    <a href="register.html" class="text-indigo-600 font-bold hover:underline">Đăng ký miễn phí</a>
                </p>
            </div>
        </div>
    </main>

    <div id="appFooter"></div>
</body>
</html>
