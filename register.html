<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản Học Sinh | EduSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js"></script>
</head>
<body class="min-h-screen flex flex-col text-slate-800" data-page="register">
    <div id="appHeader"></div>
    <div id="appFlash"></div>

    <main class="flex-1">
        <div class="max-w-lg mx-auto px-4 py-10">
            <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/50 p-8">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center text-2xl mx-auto shadow-lg shadow-emerald-500/30 mb-3">
                        <i class="fa-solid fa-user-graduate"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-slate-900">Đăng Ký Tài Khoản Học Sinh</h1>
                    <p class="text-xs text-slate-500 mt-1">Tạo tài khoản để luyện đề Toán • Anh • Lý • Hóa và lưu bảng điểm cá nhân</p>
                </div>

                <div id="regErrorBox" class="hidden mb-5 p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-sm"></i>
                    <span id="regErrorText"></span>
                </div>

                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Họ và tên học sinh *</label>
                        <input type="text" id="regFullname" required
                               class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 outline-none text-sm font-medium">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tên đăng nhập *</label>
                            <input type="text" id="regUsername" required
                                   class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 outline-none text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Email (Tùy chọn)</label>
                            <input type="email" id="regEmail"
                                   class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 outline-none text-sm font-medium">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Mật khẩu *</label>
                            <input type="password" id="regPassword" required
                                   class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 outline-none text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nhập lại mật khẩu *</label>
                            <input type="password" id="regConfirm" required
                                   class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 outline-none text-sm font-medium">
                        </div>
                    </div>

                    <button type="submit" id="regSubmitBtn" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-lg shadow-emerald-500/25 transition">
                        Hoàn tất đăng ký
                    </button>
                </form>

                <p class="text-center text-xs text-slate-500 mt-6">
                    Đã có tài khoản?
                    <a href="login.html" class="text-indigo-600 font-bold hover:underline">Đăng nhập ngay</a>
                </p>
            </div>
        </div>
    </main>

    <div id="appFooter"></div>
</body>
</html>
