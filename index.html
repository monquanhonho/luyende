<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Đề Luyện Tập Toán • Anh • Lý • Hóa | EduSmart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js"></script>
</head>
<body class="min-h-screen flex flex-col text-slate-800" data-page="index">
    <div id="appHeader"></div>
    <div id="appFlash"></div>

    <main class="flex-1">
        <!-- Banner Hero -->
        <section class="relative overflow-hidden bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-12 relative z-10">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                    <div class="lg:col-span-7">
                        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-200 text-xs font-semibold mb-4">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            Phòng Luyện Đề Trực Tuyến THPT Quốc Gia 2026
                        </div>
                        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight">
                            Luyện Đề Trắc Nghiệm <span class="bg-gradient-to-r from-blue-400 via-teal-300 to-amber-300 bg-clip-text text-transparent">Toán • Anh • Lý • Hóa</span>
                        </h1>
                        <p class="text-slate-300 text-sm sm:text-base mt-3 max-w-2xl leading-relaxed">
                            Kho đề được phân chia rõ ràng theo từng bộ môn và mức độ nhận thức. Học sinh làm bài trực tiếp, bấm giờ tự động và xem lời giải chi tiết ngay sau khi nộp bài.
                        </p>
                        <div id="heroAuthButtons"></div>
                    </div>
                    <div class="lg:col-span-5" id="heroRightBox"></div>
                </div>
            </div>
        </section>

        <!-- Cards chọn môn -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 -mt-6 relative z-20">
            <div id="subjectCardsGrid" class="grid grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4"></div>
        </section>

        <!-- Thanh tìm kiếm & lọc mức độ -->
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
            <form id="filterForm" class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <div class="relative flex-1">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput"
                           placeholder="Tìm kiếm đề thi theo chuyên đề (VD: Hàm số, Ngữ pháp, Dao động, Este...)"
                           class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-indigo-500 outline-none text-sm">
                </div>
                <select id="levelSelect" class="px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm font-semibold text-slate-700 outline-none focus:border-indigo-500">
                    <option value="">Tất cả mức độ</option>
                    <option value="Chuẩn THPT QG">Chuẩn THPT QG</option>
                    <option value="Cơ bản">Mức độ: Cơ bản</option>
                    <option value="Thông hiểu">Mức độ: Thông hiểu</option>
                    <option value="Vận dụng cao">Mức độ: Vận dụng cao</option>
                </select>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold transition">
                    Lọc đề thi
                </button>
                <a href="index.html" id="clearFilterBtn" class="hidden px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold text-center transition">
                    Xóa lọc
                </a>
            </form>
        </section>

        <!-- Danh sách Đề thi -->
        <section id="examsContainer" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-10">
            <div class="bg-white rounded-3xl border border-slate-200/80 p-12 text-center text-slate-500 text-sm">
                <i class="fa-solid fa-spinner fa-spin mr-2 text-indigo-600"></i> Đang tải kho đề thi...
            </div>
        </section>
    </main>

    <div id="appFooter"></div>
</body>
</html>
